<!DOCTYPE html>
<html>
<head>
<title>INFILTRATION PROTOCOL</title>

<style>
body {
  background:#0b0b0b;
  color:white;
  font-family:Arial;
  text-align:center;
  padding:30px;
  font-size:220%;
}

.panel {
  border:3px solid #FFD200;
  padding:25px;
  margin:25px;
}

button {
  font-size:1.2em;
  padding:0.6em 1.2em;
  background:#FFD200;
  border:none;
  margin-top:20px;
}

input {
  font-size:100%;
  padding:15px;
  width:70%;
  text-align:center;
  margin-top:15px;
}

img {
  width:80%;
  max-width:400px;
  margin-top:15px;
}
</style>

<script>

/* SAFE RANDOM */
var missionPool = ["A","B","C"];

function getMission(){
 var i = Math.floor(Math.random()*missionPool.length);
 var m = missionPool[i];
 missionPool.splice(i,1);
 return m;
}

/* SHOW MISSION */
function showMission(id, number){

 var type = getMission();
 var content = "";

 if(type==="A"){
  content =
  "<h2>MISSION " + number + " — INTEL</h2>" +
  "<p>Agent left behind critical intel.</p>" +
  "<p><b>EXERCISE:</b><br>Push-Up High Five × 30</p>" +
  "<p><b>RECORDING:</b><br>Record FULL TEAM</p>" +
  "<img src='mapA.jpgg src='imageA.jpg(type==="B"){
  content =
  "<h2>MISSION " + number + " — STEALTH ROUTE</h2>" +
  "<p>Remain undetected.</p>" +
  "<p><b>EXERCISE:</b><br>Bear crawl + 60 pulses</p>" +
  "<p><b>RECORDING:</b><br>Record FULL TEAM</p>" +
  "<img src='mapB.jpgg src='imageB.jpg(type==="C"){
  content =
  "<h2>MISSION " + number + " — CAPTURE THE PROFESSOR</h2>" +
  "<p>Capture target.</p>" +
  "<p><b>EXERCISE:</b><br>Burpee High Five × 20</p>" +
  "<p><b>PHOTO:</b><br>Take team photo</p>" +
  "<img src='mapC.jpgg src='";
 }

 document.getElementById(id).innerHTML = content;
 document.getElementById(id).style.display = "block";
}

/* PIN HANDLERS */
function pin1(){
 if(document.getElementById("pin1").value==="1986"){
   document.getElementById("lap").style.display="none";
   showMission("mission1",1);
   document.getElementById("pin2Panel").style.display="block";
 } else alert("INCORRECT PIN");
}

function pin2(){
 if(document.getElementById("pin2").value==="2388"){
   document.getElementById("pin2Panel").style.display="none";
   showMission("mission2",2);
   document.getElementById("pin3Panel").style.display="block";
 } else alert("INCORRECT PIN");
}

function pin3(){
 if(document.getElementById("pin3").value==="3896"){
   document.getElementById("pin3Panel").style.display="none";
   showMission("mission3",3);
 } else alert("INCORRECT PIN");
}

</script>

</head>

<body>

<h1>INFILTRATION PROTOCOL</h1>

<!-- ✅ BEGIN BUTTON (NO JS DEPENDENCY) -->
<div id="intro" class="panel">
<p><b>ATTENTION</b><br><br>
You are deployed into a threat zone.</p>

<button onclick="
document.getElementById('intro').style.display='none';
document.getElementById('lap').style.display='block';
">
BEGIN MISSION
</button>
</div>

<!-- PIN 1 -->
<div id="lap" class="panel" style="display:none;">
<h2>MISSION 1 AUTHORISATION</h2>
<input id="pin1"><br>

<button onclick="pin1()">AUTHORISE</button>
</div>

<div id="missions">

<div id="mission1" class="panel" style="display:none;"></div>

<div id="pin2Panel" class="panel" style="display:none;">
<h2>MISSION 2 AUTHORISATION</h2>
<input id="pin2"><br>

<button onclick="pin2()">AUTHORISE</button>
</div>

<div id="mission2" class="panel" style="display:none;"></div>

<div id="pin3Panel" class="panel" style="display:none;">
<h2>MISSION 3 AUTHORISATION</h2>
<input id="pin3"><br>

<button onclick="pin3()">AUTHORISE</button>
</div>

<div id="mission3" class="panel" style="display:none;"></div>

</div>

</body>
</html>
