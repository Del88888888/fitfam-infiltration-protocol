<!DOCTYPE html>
<html>
<head>
<title>INFILTRATION PROTOCOL</title>

<style>
body {

  color:white;

}

.panel {
  border:2px solid yellow;

<script>

/* RANDOM */
function getRandom(){
 const m = ["A","B","C"];
 return m[Math.floor(Math.random()*m.length)];
}

/* SHOW MISSION */
function showMission(num){
 let type = getRandom();

 let content = "";

 if(type==="A"){
  content += "<h2>MISSION "+num+" — INTEL</h2>";

  content += "<h2>MISSION "+num+" — STEALTH ROUTE</h2>";
  content += "<p>Remain undetected.</p>";

  content += "<img src='mapBontent += "<img src='";

  content += "<h2>MISSION "+num+" — CAPTURE THE PROFESSOR</h2>";
  content += "<p>Capture target.</p>";
  content += "<p><b>EXERCISE:</b><br>Burpee High Five x20</p>";
  content += "mapC.jpg";
  content += "<img src='imageC.jpgv.innerHTML = content;

 document.body.appendChild(div);

/* BUTTON HANDLERS */

function startGame(){
 document.getElementById("intro").style.display="none";
 document.getElementById("pin1box").style.display="block";
}

function submitPin1(){
 if(document.getElementById("pin1").value==="1986"){
   document.getElementById("pin1box").style.display="none";
   showMission(1);
   document.getElementById("pin2box").style.display="block";
 } else alert("INCORRECT PIN");
}

function submitPin2(){
 if(document.getElementById("pin2").value==="2388"){
   document.getElementById("pin2box").style.display="none";
   showMission(2);
   document.getElementById("pin3box").style.display="block";
 } else alert("INCORRECT PIN");
}

function submitPin3(){
 if(document.getElementById("pin3").value==="3896"){
   document.getElementById("pin3box").style.display="none";
   showMission(3);
 } else alert("INCORRECT PIN");
}

</script>

</head>

<body>

<div id="intro" class="panel">
<p><b>ATTENTION.</b><br><br>
You are deployed into a threat zone.
</p>

<button onclick="startGame()">BEGIN MISSION</button>
</div>

<div id="pin1box" class="panel hidden">
<h2>MISSION 1 AUTHORISATION</h2>
<input id="pin1"><br>
<button onclick="submitPin1()">AUTHORISE</button>
</div>

<div id="pin2box" class="panel hidden">
<h2>MISSION 2 AUTHORISATION</h2>
<input id="pin2"><br>
<button onclick="submitPin2()">AUTHORISE</button>
</div>

<div id="pin3box" class="panel hidden">
<h2>MISSION 3 AUTHORISATION</h2>
<input id="pin3"><br>
<button onclick="submitPin3()">AUTHORISE</button>
</div>

</body>
</html>
