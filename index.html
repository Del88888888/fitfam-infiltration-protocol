<script>

/* ✅ NO REPEAT RANDOM SYSTEM */
var missionPool = ["A","B","C"];

function getMission(){
 var i = Math.floor(Math.random()*missionPool.length);
 var m = missionPool[i];
 missionPool.splice(i,1);
 return m;
}

/* ✅ FULL MISSION CONTENT */
function showMission(id, number){

 var type = getMission();
 var content = "";

 if(type==="A"){
  content =
  "<h2>MISSION " + number + " — INTEL</h2>" +
  "<p>Agent has left behind critical intel.</p>" +
  "<p><b>EXERCISE:</b><br>Push-Up High Five × 30</p>" +
  "<p><b>RECORDING:</b><br>Record FULL TEAM (5–10 sec)<br>Upload with team number</p>";
 }

 if(type==="B"){
  content =
  "<h2>MISSION " + number + " — STEALTH ROUTE</h2>" +
  "<p>Proceed without being detected.</p>" +
  "<p><b>EXERCISE:</b><br>Bear crawl + 60 Superman pulses</p>" +
  "<p><b>RECORDING:</b><br>Record FULL TEAM (5–10 sec)<br>Upload with team number</p>";
 }

 if(type==="C"){
  content =
  "<h2>MISSION " + number + " — CAPTURE THE PROFESSOR</h2>" +
  "<p>High-value target identified.</p>" +
  "<p><b>EXERCISE:</b><br>Burpee High Five × 20</p>" +
  "<p><b>PHOTO:</b><br>Take team + Professor photo<br>Upload with team number</p>";
 }

 document.getElementById(id).innerHTML = content;
 document.getElementById(id).style.display = "block";
}

</script>
