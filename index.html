<!DOCTYPE html>
<html>
<head>
<title>FitFam Infiltration Protocol</title>

<style>
body {
  background:#0b0b0b;
  color:white;
  font-family:Arial;
  text-align:center;
  padding:30px;
  font-size:280%;
}

h1 { color:#FFD200; }

.panel {
  border:3px solid #FFD200;
  padding:25px;
  margin:25px auto;
  width:90%;
  border-radius:15px;
}

button {
  font-size:100%;
  padding:20px 40px;
  margin-top:25px;
  background:#FFD200;
  color:black;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

input {
  font-size:100%;
  padding:15px;
  width:300px;
  text-align:center;
  margin-top:15px;
  border-radius:10px;
  border:none;
}

.hidden { display:none; }

img {
  width:80%;
  max-width:500px;
  margin-top:20px;
  border-radius:10px;
}
</style>

<script>
let missionPool=["A","B","C"];
let missionCount=0;

function nextMission(){
 let i=Math.floor(Math.random()*missionPool.length);
 return missionPool.splice(i,1)[0];
}

function unlockMission1(){
 document.getElementById("lap").style.display="none";
 showMission();
}

function showMission(){
 missionCount++;

 let m=nextMission();
 let container=document.createElement("div");
 container.className="panel";

 let title="MISSION "+missionCount;

 if(m==="A"){
 container.innerHTML=`<h2>${title} — INTEL</h2>
<p>INTEL:<br><br>
One of our embedded agents reports that the terrorist leader has evacuated the area.<br><br>
Before extraction, the agent left behind intel.<br><br>
This intel contains an entry point into their network.<br><br>
Recover the intel.</p>

<p><b>EXERCISE:</b><br>
Run to the location (map + photo)<br>
Partner Push-Up High Five × 30 each</p>

<img src="mapA.jpgg`;
}

if(m==="B"){
 container.innerHTML=`<h2>${title} — STEALTH ROUTE</h2>
<p>STEALTH DIRECTIVE:<br><br>
Intel indicates a low-visibility access route nearby.</p>

<p><b>EXERCISE:</b><br>
Bear crawl<br>60 Superman pulses</p>

<img src="map src="`;
}

if(m==="C"){
 container.innerHTML=`<h2>${title} — CAPTURE THE PROFESSOR</h2>
<p>UPDATE:<br><br>
We have located a high-value target.</p>

<p><b>EXERCISE:</b><br>
Run<br>Burpees</p>

<img src
<imgeC.jpg`;
}

/* ✅ FIXED LINE */
document.getElementById("missionContainer").appendChild(container);

if(missionCount===1)
 document.getElementById("pin2Panel").style.display="block";
}
</script>
</head>

<body>

<h1>INFILTRATION PROTOCOL</h1>

<div id="intro" class="panel">
ATTENTION.<br><br>
Trust nothing.<br><br>

<button onclick="document.getElementById('intro').style.display='none'; document.getElementById('lap').style.display='block';">
BEGIN MISSION
</button>
</div>

<div id="lap" class="panel hidden">
<h2>MISSION 1 AUTHORISATION</h2>
<input id="pin1">
<br>
<button onclick="
if(document.getElementById('pin1').value==='1986'){
 document.getElementById('pin1').value='';
 document.getElementById('lap').style.display='none';
 showMission();
}else{ alert('INCORRECT PIN'); }">
AUTHORISE
</button>
</div>

<!-- ✅ ADD THIS -->
<div id="missionContainer"></div>

<div id="pin2Panel" class="panel hidden">
<h2>MISSION 2 AUTHORISATION</h2>
<input id="pin2">
</div>

</body>
</html>
