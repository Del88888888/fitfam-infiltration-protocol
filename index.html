<!DOCTYPE html>
<html>
<head>
<title>INFILTRATION PROTOCOL</title>

<style>
body {
  background:#0b0b0b;
  color:white;
  font-family:Arial;
  text-align:center;
  padding:30px;
  font-size:250%; /* ✅ 2.5x SIZE */
}

.panel {
  border:3px solid #FFD200;
  padding:20px;
  margin:20px;
}

button {
  padding:10px 20px;
  background:#FFD200;
  border:none;
  margin-top:15px;
  font-size:80%;
}

.hidden { display:none; }
</style>

</head>

<body>

<h1>INFILTRATION PROTOCOL</h1>

<!-- INTRO -->
<div id="intro" class="panel">
<p><b>ATTENTION.</b><br><br>
You are a Special Forces unit deployed into an active threat zone.
</p>

<!-- ✅ FIXED BUTTON (NO JS DEPENDENCY ISSUE) -->
<button onclick="
document.getElementById('intro').style.display='none';
document.getElementById('lap').style.display='block';
">
BEGIN MISSION
</button>

</div>

<!-- PIN -->
<div id="lap" class="panel hidden">
<h2>MISSION 1 AUTHORISATION</h2>

<input id="pin1"><br>

<button onclick="
if(document.getElementById('pin1').value==='1986'){
 document.getElementById('lap').style.display='none';
 document.getElementById('mission1').style.display='block';
} else {
 alert('INCORRECT PIN');
}">
AUTHORISE
</button>

</div>

<!-- ✅ SIMPLE MISSION (SAFE TEST) -->
<div id="mission1" class="panel hidden">
<h2>MISSION 1</h2>
<p>Mission is working ✅</p>
</div>

</body>
</html>
