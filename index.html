<!DOCTYPE html>
<html>
<head>
<title>INFILTRATION PROTOCOL</title>

<style>
body {
  background:#0b0b0b;
  color:white;
  font-family:Arial;
  text-align:center;
  padding:30px;
  font-size:250%;
}

.panel {
  border:3px solid #FFD200;
  padding:25px;
  margin:25px;
}

/* FINAL BUTTON SIZE */
button {
  font-size:1.2em;
  padding:0.6em 1.2em;
  background:#FFD200;
  border:none;
  margin-top:20px;
  border-radius:10px;
}

input {
  font-size:100%;
  padding:17px;
  width:70%;
  max-width:340px;
  text-align:center;
  border-radius:10px;
  border:none;
  margin-top:15px;
}

.hidden { display:none; }
</style>

<script>

/* ✅ RANDOM SYSTEM (NO REPEAT) */
let missionPool = ["A","B","C"];

function nextMission(){
 let i = Math.floor(Math.random()*missionPool.length);
 return missionPool.splice(i,1)[0];
}

/* ✅ INSERT RANDOM MISSION */
function showMission(missionNumber){

 let m = nextMission();
 let container = document.createElement("div");
 container.className = "panel";

 if(m==="A"){
 container.innerHTML = `
<h2>MISSION ${missionNumber} — INTEL</h2>
<p>INTEL:<br><br>
One of our embedded agents reports that the terrorist leader has evacuated the area.</p>

<p><b>EXERCISE:</b><br>
Run to location<br>
Push-Up High Five × 30</p>
`;
}

 if(m==="B"){
 container.innerHTML = `
<h2>MISSION ${missionNumber} — STEALTH ROUTE</h2>
<p>STEALTH DIRECTIVE:<br><br>
Movement must remain undetected.</p>

<p><b>EXERCISE:</b><br>
Bear crawl<br>
60 Superman pulses</p>
`;
}

 if(m==="C"){
 container.innerHTML = `
<h2>MISSION ${missionNumber} — CAPTURE THE PROFESSOR</h2>
<p>UPDATE:<br><br>
Capture THE PROFESSOR.</p>

<p><b>EXERCISE:</b><br>
Partner Burpee High Five × 20</p>
`;
}

 document.getElementById("missions").appendChild(container);
}

</script>

</head>

<body>

<h1>INFILTRATION PROTOCOL</h1>

<!-- INTRO -->
<div id="intro" class="panel">
<p><b>ATTENTION.</b><br><br>
You are a Special Forces unit deployed into an active threat zone.
</p>

<button onclick="
document.getElementById('intro').style.display='none';
document.getElementById('lap').style.display='block';
">
BEGIN MISSION
</button>
</div>

<!-- PIN 1 -->
<div id="lap" class="panel hidden">
<h2>MISSION 1 AUTHORISATION</h2>
<input id="pin1"><br>

<button onclick="
if(document.getElementById('pin1').value==='1986'){
 document.getElementById('lap').style.display='none';
 showMission(1);
 document.getElementById('pin2Panel').style.display='block';
} else { alert('INCORRECT PIN'); }">
AUTHORISE
</button>
</div>

<div id="missions"></div>

<!-- PIN 2 -->
<div id="pin2Panel" class="panel hidden">
<h2>MISSION 2 AUTHORISATION</h2>
<input id="pin2"><br>

<button onclick="
if(document.getElementById('pin2').value==='2388'){
 document.getElementById('pin2Panel').style.display='none';
 showMission(2);
 document.getElementById('pin3Panel').style.display='block';
} else { alert('INCORRECT PIN'); }">
AUTHORISE
</button>
</div>

<!-- PIN 3 -->
<div id="pin3Panel" class="panel hidden">
<h2>MISSION 3 AUTHORISATION</h2>
<input id="pin3"><br>

<button onclick="
if(document.getElementById('pin3').value==='3896'){
 document.getElementById('pin3Panel').style.display='none';
 showMission(3);
} else { alert('INCORRECT PIN'); }">
AUTHORISE
</button>
</div>

</body>
</html>
