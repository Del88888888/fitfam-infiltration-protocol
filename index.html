<script>

function getRandom(){

 return m[Math.floor(Math.random()*m.length)];
}

 div.innerHTML = html;
 document.body.appendChild(div);
}

</script>

</head>

<body>

<!-- INTRO -->
<div id="intro" class="panel">

<p><b>ATTENTION</b><br><br>
You are entering a mission</p>

<button onclick="
document.getElementById('intro').style.display='none';
document.getElementById('pin1box').style.display='block';

<!-- PIN 1 -->

">
